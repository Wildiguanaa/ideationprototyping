<!DOCTYPE html> <!-- Tells the web browser that this file is written in modern HTML5 -->
<html lang="en"> <!-- Starts the webpage document and sets the primary language to English -->
<head> <!-- Opens the hidden settings area for metadata, page titles, and linked files -->
    <meta charset="UTF-8"> <!-- Sets universal character encoding so text displays without glitches -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Ensures the website fits and scales correctly on mobile devices -->
    <title>Ideation & Prototyping</title> <!-- Defines the title text displayed on the browser tab -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <link rel="stylesheet" href="style.css"> <!-- Links the external CSS stylesheet file to this HTML document -->
</head> <!-- Closes the hidden settings section of the webpage -->
<body> <!-- Opens the visible body section where all website content goes -->



<!-- TOP TITLE HEADER -->
    <header class="top-header"> <!-- Container for the top section of the website -->
        <h1 class="main-title">Ideation & Prototyping</h1>
    </header> <!-- Closes the top section -->


      <!-- YOUR LINKS GO HERE (Inside the body tags) -->
    <!-- <a href="fall2026.html">Fall 2026</a> <!-- Creates a link pointing to the Fall 2026 page -->
    <!-- <a href="summer2026.html">Summer 2026</a> Creates a link pointing to the Summer 2026 page --> -->

<!-- </body> Closes the visible content section of the webpage -->
<!-- </html> Marks the absolute end of the HTML document structure -->





    <!-- MAIN CONTENT AREA -->
    <div class="main-container">

        <!-- LEFT SIDEBAR -->
        <aside class="left-sidebar">
            
            <!-- 2. REPLACE THE OLD LABEL WITH THIS BUTTON AND ICON -->
            <button class="menu-toggle-btn" id="menuToggle" title="Toggle Menu">
                <i class="fa-solid fa-bars"></i> <!-- The actual menu bars icon -->
            </button>

            <!-- 3. DROPDOWN BOX (Initially hidden by CSS until clicked) -->
            <select name="seasons" id="seasons" class="dropdown-menu" onchange="location = this.value;">
                <option value="">-- Select Options --</option>
                <option value="fall2026.html">Fall 2026</option>
                <option value="summer2026.html">Summer 2026</option>
            </select>
        </aside>

        <!-- RIGHT CONTENT WINDOW -->
        <main class="content-area">
            <p>Welcome! Your page text or graphics go right here.</p>
        </main>

    </div>

    <!-- 4. ADD THIS JAVASCRIPT: Handles the click logic to show/hide the dropdown -->
    <script>
        // Finds the button and the dropdown list in your HTML
        const toggleButton = document.getElementById('menuToggle');
        const dropdownMenu = document.getElementById('seasons');

        // Listens for a click on the icon button
        toggleButton.addEventListener('click', () => {
            // Toggles the custom visibility class 'show' on the dropdown element
            dropdownMenu.classList.toggle('show');
        });
    </script>
</body>
</html>
