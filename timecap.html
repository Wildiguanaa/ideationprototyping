<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time Capsule</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: #000; color: #b8b2a7;
    font-family: "Courier New", monospace; overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  /* ---------- stage ---------- */
  #stage {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 24px; text-align: center; gap: 18px;
  }
  #prompt {
    font-size: 13px; letter-spacing: 3px; text-transform: uppercase;
    min-height: 20px; opacity: 0; transition: opacity 1.5s;
  }
  #prompt.show { opacity: 1; }

  /* the one input: caret is the "cursor" */
  #field {
    background: none; border: none; outline: none;
    color: #e8e2d6; font: inherit; font-size: 18px;
    text-align: center; width: min(420px, 90vw);
    caret-color: #e8e2d6; caret-shape: block;
  }
  #hint {
    font-size: 10px; letter-spacing: 3px; color: #4a463f;
    text-transform: uppercase; transition: opacity 1s;
  }
  #response {
    font-size: 14px; max-width: 420px; line-height: 1.6;
    min-height: 24px; color: #8d877b;
  }

  /* ---------- left text surge ---------- */
  #surge {
    position: fixed; left: 14px; top: 14px; bottom: 14px; width: 24%;
    overflow: hidden; pointer-events: none;
    font-size: 10px; line-height: 1.5; color: #4a463f;
    transform-origin: top; transition: transform 1.2s ease-in, opacity 1.2s;
  }
  #surge.collapse { transform: scaleY(0); opacity: 0; }

  /* ---------- dirt ---------- */
  #dirt {
    position: fixed; left: 0; right: 0; bottom: 0; height: 0;
    background:
      radial-gradient(circle at 20% 30%, #3a2c20 0 2px, transparent 3px) 0 0 / 23px 19px,
      radial-gradient(circle at 70% 60%, #1f160e 0 2px, transparent 3px) 0 0 / 31px 27px,
      radial-gradient(circle at 50% 50%, #4b392a 0 1px, transparent 2px) 0 0 / 13px 11px,
      linear-gradient(#2a1f15, #120c07);
    opacity: 0; transition: opacity 2.5s, height 2.5s;
    z-index: 0;
  }
  #dirt.in { opacity: 1; height: 55vh; }
  #dirt.dig { animation: dig .25s; }
