<!DOCTYPE html> 
<html> 
<head>   
    <meta charset="utf-8" />   
    <title>Downtown Brooklyn AR History Walk</title>
    <!-- loading A-Frame and AR.js Location-Based libraries -->
    <script src="https://aframe.io"></script>  <!-- Loads the A-Frame 3D engine over the internet -->
    <script src="https://githack.com"></script>   <!-- Loads the AR.js library so A-Frame can use your phone's camera and GPS -->
        
    <!-- style opens the CSS section to style how the screen overlay looks -->
    <style> 
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #ui-overlay {
        position: fixed; 
        top: 2opx;
        left: 50%; 
        transform: 
        translateX(-50%);
        width: 85%; background: rgba(0, 0, 0, 0.8); color: white;
        padding: 15px; border-radius: 12px; z-index: 999; text-align: center;
        }
        #history-card { 
            display: none; 
            margin-top: 
            10px; 
            border-top: 
            1px solid #555; 
            padding-top: 
            10px; 
        }
    </style>
    </head>
    <body>
        <!-- creates the floating text box at the bottom of the screen -->   
        <div id="ui-overlay">      
        <!-- shows live GPS status and distance in meters; js updates this text automatically -->     
            <div id="status">Location data loading...</div>      
         <!-- container for the historical info that unlocks when you arrive -->     
            <div id="history-card">        
        <!-- displays the name of the NYC landmark -->       
                <h3 id="landmark-title">Brooklyn Borough Hall</h3>        
        <!-- displays the historical story or fact about the landmark; next one is New York Transit Museum-->       
                <p id="landmark-fact">Built and completed in 1848 as Brooklyn's City Hall, and became Brooklyn Borough Hall in 1898 when the borough consolidated into a greater New York City.</p>      
            </div> <!-- closes the #history-card container -->   
        </div> <!-- closes the #ui-overlay container -->

        <!-- createing the 3D ar world, hiding the VR goggles button, and turning on the phone's webcam -->   
        <a-scene vr-mode-ui="enabled: false" arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;">      
            <!-- linking your phone's physical movement, compass, and GPS to the virtual 3D camera -->     
            <a-camera gps-camera rotation-reader></a-camera>       
            <!-- creating a 3D box (placeholder for your animal) pinned to real-world GPS coordinates -->    
             <a-box        
                id="pigeon" 
                <!-- giving this 3D object a name so JavaScript can change its color later -->
                color="#FF6B6B" 
                <!-- setting the starting color of the box to coral red -->       
                scale="3 3 3" 
                <!-- making the object 3 meters wide, 3 meters tall, and 3 meters deep -->       
                gps-entity-place="latitude: 40.6928; longitude: -73.9903;"> 
                <!-- pinn the object to brooklyn borough hall -->     
            </a-box> <!-- close the 3D box object -->   
        </a-scene> <!-- close the 3D AR world -->
        

        <script> <!-- Opens the JavaScript section that handles GPS math and game logic -->     
            const targetLat = 40.6928; // storing the landmark's latitude (North/South coordinate)     
            const targetLon = -73.9903; // storing the landmark's longitude (East/West coordinate)     
            const triggerDistanceMeters = 25; // setting how close (in meters) you must walk to unlock the history      
            // 
            // defining a math function (Haversine formula) to measure distance between two GPS points     
            function getDistance(lat1, lon1, lat2, lon2) {        
                const R = 6371e3; // storing the Earth's radius in meters (6,371,000 meters)       
                const p1 = lat1 * Math.PI / 180; // converting your latitude from degrees into radians for math       
                const p2 = lat2 * Math.PI / 180; // convetting the landmark's latitude into radians       
                const dp = (lat2 - lat1) * Math.PI / 180; // calculating the North/South difference in radians       
                const dl = (lon2 - lon1) * Math.PI / 180; // calculating the East/West difference in radians       
                // 
                // calculating the curved distance across the Earth's surface (part 1)       
                const a = Math.sin(dp/2) * Math.sin(dp/2) + 
                Math.cos(p1) * Math.cos(p2) * Math.sin(dl/2) * Math.sin(dl/2); // (part 2)       
                
                return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a))); // Returns the final distance in meters     
            } // close the distance math function      
            // 
            // tracks phone's GPS location as you walk around     
            navigator.geolocation.watchPosition((position) => {        
                const userLat = position.coords.latitude; // grab current live latitude from the phone       
                const userLon = position.coords.longitude; // grab current live longitude from the phone       
                // 
                
                // calculating how many meters away you are from the landmark and rounds to a whole number      
                const distance = Math.round(getDistance(userLat, userLon, targetLat, targetLon));         
                // updating the text on screen to show your live distance to the landmark       
                document.getElementById('status').innerText = `Distance to landmark: ${distance}m`;         
                // checking if you have walked inside the 25-meter trigger zone       
                if (distance <= triggerDistanceMeters) {          
                    document.getElementById('history-card').style.display = 'block'; // Reveals the hidden historical fact card         
                    document.getElementById('pigeon').setAttribute('color', '#4ECDC4'); // Changes the 3D box color to teal as a reward       
                } // closing the "if close enough" check     
            }, (err) => { // running this backup code if the phone blocks or loses the GPS signal       
            // // displaying an error message telling the player to turn on location permissions       
                document.getElementById('status').innerText = "GPS Error: Enable location permissions.";      
            }, { enableHighAccuracy: true }); // telling the phone to use its most accurate GPS chip instead of rough Wi-Fi estimates   
        </script> <!-- close the JavaScript logic section --> 
    </body> <!-- close the visible webpage body --> 
</html> <!-- close the entire HTML document -->
